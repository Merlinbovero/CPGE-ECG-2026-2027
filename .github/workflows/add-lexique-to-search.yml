name: Index reformulation lexicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-lexique-to-search.yml'

permissions:
  contents: write

jobs:
  patch-search-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add lexicon to global search index
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/data.js')
          s = p.read_text(encoding='utf-8')
          marker = '    {"id": "cg-index"'
          entry = '''    {"id": "cg-lexique-reformulation", "m": "cg", "r": true, "n": "R1", "t": "Synonymes & lexique de reformulation — Résumé de texte", "u": "culture-generale/lexique-reformulation.html", "s": ["synonyme", "synonymes", "reformulation", "résumé", "resume", "contraction", "synthèse", "synthèse", "vocabulaire", "lexique", "connecteurs logiques", "faux synonymes", "compression", "reformuler un texte", "Culture générale"]},\n'''
          if '"id": "cg-lexique-reformulation"' in s:
              print('Already indexed')
          elif marker not in s:
              raise SystemExit('Insertion marker not found')
          else:
              s = s.replace(marker, entry + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit search index
        run: |
          if git diff --quiet -- js/data.js; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "Index synonym and reformulation lexicon in global search"
          git push
